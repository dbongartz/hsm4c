name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & test (${{ matrix.compiler }}, ${{ matrix.library }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        library: [static, shared]
    env:
      PRESET: ci-${{ matrix.compiler }}
      SHARED: ${{ matrix.library == 'shared' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset "$PRESET" -DBUILD_SHARED_LIBS="$SHARED"
      - name: Build
        run: cmake --build --preset "$PRESET"
      - name: Test
        run: ctest --preset "$PRESET"
      - name: Install
        run: cmake --install "build/$PRESET" --prefix "$RUNNER_TEMP/prefix"
      - name: Build examples against installed package
        run: |
          cmake -S examples -B "$RUNNER_TEMP/examples" -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build "$RUNNER_TEMP/examples"
          "$RUNNER_TEMP/examples/hsm4c_demo"

  minimal:
    name: Minimal configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure, build and test (all optional features off)
        run: cmake --workflow --preset minimal

  embedded:
    name: Embedded (${{ matrix.cpu }}, ${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [cortex-m0plus, cortex-m4]
        config: [full, minimal]
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi
      - name: Build library
        env:
          MINIMAL: >-
            -DHSM4C_CONFIG_STATE_NAMES=OFF -DHSM4C_CONFIG_RUN_FN=OFF -DHSM4C_CONFIG_GUARDS=OFF
            -DHSM4C_CONFIG_ACTIONS=OFF -DHSM4C_CONFIG_VALIDATE=OFF -DHSM4C_EVENT_QUEUE_SIZE=1
            -DHSM4C_STATE_ID_TYPE=uint8_t
        run: |
          # shellcheck disable=SC2086 # MINIMAL is a list of options
          cmake --preset ${{ matrix.cpu }} ${{ matrix.config == 'minimal' && '$MINIMAL' || '' }}
          cmake --build --preset ${{ matrix.cpu }}
      - name: Size and stack report
        run: |
          python3 tools/embedded_report.py build/${{ matrix.cpu }} \
            --title "${{ matrix.cpu }}, ${{ matrix.config }}" | tee -a "$GITHUB_STEP_SUMMARY"

  sanitize:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure, build and test
        run: cmake --workflow --preset sanitize

  fuzz:
    name: Fuzzing (libFuzzer, 2 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz
      - name: Fuzz
        run: |
          mkdir -p corpus
          build/fuzz/fuzz/hsm4c_fuzz -max_total_time=120 -max_len=512 corpus
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: crash-*

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pipx install gcovr==8.8
      - name: Configure, build and test
        run: cmake --workflow --preset coverage
      - name: Coverage report
        # Summary on the run page, text report in the log, HTML report as artifact.
        # The library must be fully covered. HSM4C_ASSERT branches are excluded: their failing
        # side aborts by design.
        run: |
          mkdir -p coverage
          gcovr --root . --filter src/ build/coverage \
            --exclude-branches-by-pattern '.*HSM4C_ASSERT.*' \
            --markdown-summary "$GITHUB_STEP_SUMMARY" \
            --html-details coverage/index.html \
            --txt \
            --fail-under-line 100 --fail-under-branch 100
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  lint:
    name: Lint (clang-format, clang-tidy)
    # Pinned to keep the clang tool versions stable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-format-18 clang-tidy-18
      - name: clang-format
        run: git ls-files '*.c' '*.h' '*.cpp' | xargs clang-format-18 --dry-run --Werror
      - name: Configure
        run: cmake --preset lint -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - name: GCC static analyzer
        run: |
          gcc -std=c99 -fanalyzer -Wall -Wextra -Wpedantic -Werror -I src -c src/hsm4c/hsm4c.c \
            -o /dev/null
          gcc -std=c99 -fanalyzer -Wall -Wextra -Wpedantic -Werror -I src -c src/hsm4c/hsm4c.c \
            -o /dev/null -DHSM4C_CONFIG_STATE_NAMES=0 -DHSM4C_CONFIG_RUN_FN=0 \
            -DHSM4C_CONFIG_GUARDS=0 -DHSM4C_CONFIG_ACTIONS=0 -DHSM4C_CONFIG_VALIDATE=0
      - name: clang-tidy
        run: run-clang-tidy-18 -quiet -p build/lint "$PWD/(src|test|examples|fuzz)/"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build doxygen
      - name: Build docs (warnings are errors)
        run: |
          cmake --preset docs
          cmake --build --preset docs
