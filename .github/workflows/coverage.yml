# Code coverage for GitHub Code Quality, see
# https://docs.github.com/en/code-security/how-tos/maintain-quality-code/set-up-code-coverage
name: Code Coverage

on:
  # Default branch runs provide the baseline that pull requests are compared against.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # PR head commit instead of the merge commit, so line numbers match the diff
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pipx install gcovr==8.8
      - name: Configure, build and test
        run: cmake --workflow --preset coverage
      - name: Coverage report (Cobertura)
        run: |
          gcovr --root . --filter src/ build/coverage \
            --cobertura cobertura.xml \
            --markdown-summary "$GITHUB_STEP_SUMMARY" \
            --txt
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura-report
          path: cobertura.xml

  upload-coverage:
    name: Upload coverage
    needs: test
    runs-on: ubuntu-latest
    # Pull requests from forks have no write access to the repository
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cobertura-report
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: C
          label: code-coverage/gcovr
